<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img" aria-labelledby="title desc">
  <title id="title">Model and starting-grid rank correlation by season</title>
  <desc id="desc">Spearman correlation: 2024 model 0.825, grid 0.776; 2025 model 0.764, grid 0.736; 2026 later evaluation, monitored during development, model 0.827, grid 0.790.</desc>
  <rect width="720" height="348" rx="18" fill="#111827"/>
  <text x="34" y="43" fill="#f9fafb" font-family="Arial, sans-serif" font-size="20" font-weight="700">Finishing-order rank correlation</text>
  <text x="34" y="67" fill="#aab5c5" font-family="Arial, sans-serif" font-size="13">Spearman ρ · higher is better · 2026 evaluated through round 13</text>
  <circle cx="441" cy="44" r="6" fill="#fb7185"/>
  <text x="455" y="49" fill="#dce4ef" font-family="Arial, sans-serif" font-size="12">Model</text>
  <circle cx="535" cy="44" r="6" fill="#94a3b8"/>
  <text x="549" y="49" fill="#dce4ef" font-family="Arial, sans-serif" font-size="12">Grid baseline</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="190" y="281">0.70</text><text x="340" y="281">0.75</text><text x="490" y="281">0.80</text><text x="640" y="281">0.85</text>
  </g>
  <g stroke="#334155" stroke-width="1">
    <path d="M190 91V262 M340 91V262 M490 91V262 M640 91V262"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#e5e7eb">
    <text x="34" y="126">2024</text><text x="34" y="181">2025</text><text x="34" y="236" font-weight="700">2026</text>
  </g>
  <g stroke="#52647c" stroke-width="4" stroke-linecap="round">
    <path d="M418 120H565 M298 175H382 M460 230H571"/>
  </g>
  <g fill="#94a3b8">
    <circle cx="418" cy="120" r="7"/><circle cx="298" cy="175" r="7"/><circle cx="460" cy="230" r="7"/>
  </g>
  <g fill="#fb7185">
    <circle cx="565" cy="120" r="8"/><circle cx="382" cy="175" r="8"/><circle cx="571" cy="230" r="8"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#f9fafb">
    <text x="577" y="124">0.825</text><text x="394" y="179">0.764</text><text x="583" y="234" font-weight="700">0.827</text>
  </g>
  <text x="34" y="320" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">2024–2025: model selection. 2026: monitored during development.</text>
</svg>
